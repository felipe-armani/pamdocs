name: Deploy to GitHub Pages

on:
  push:
    branches: ["gh-pages-deploy", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Pre-render static HTML
        run: bun run prerender

      - name: Copy static assets
        run: |
          mkdir -p _site
          cp -r dist/client/* _site/
          # Copy pre-rendered HTML pages
          cp -r dist/prerendered/* _site/
          # .nojekyll ensures GitHub Pages doesn't ignore underscore-prefixed files
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
